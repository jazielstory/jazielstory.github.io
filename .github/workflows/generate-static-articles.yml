name: Generate static article pages and apply editorial image rules

on:
  push:
    branches:
      - main
      - "audit/**"
    paths:
      - "articles.json"
      - "article.html"
      - ".github/scripts/generate-static-articles.mjs"
      - ".github/workflows/generate-static-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-static-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate article pages
        run: node .github/scripts/generate-static-articles.mjs
      - name: Verify generated article pages
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync("articles.json", "utf8"));
            const articles = Array.isArray(data.articles) ? data.articles : [];
            const missing = articles.filter(a => !a.slug || !fs.existsSync(`articles/${a.slug}.html`));
            if (missing.length) {
              console.error("Missing generated pages:", missing.map(a => a.slug || "(empty slug)").join(", "));
              process.exit(1);
            }
            console.log(`Verified ${articles.length} generated article pages.`);
          '
      - name: Verify generated article SEO and asset paths
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync("articles.json", "utf8"));
            const articles = Array.isArray(data.articles) ? data.articles : [];
            for (const article of articles) {
              const file = "articles/" + article.slug + ".html";
              const html = fs.readFileSync(file, "utf8");
              const marker = "<script type=\\"application/ld+json\\">";
              const start = html.indexOf(marker);
              if (start < 0) throw new Error("Missing Article JSON-LD: " + article.slug);
              const bodyStart = start + marker.length;
              const bodyEnd = html.indexOf("</script>", bodyStart);
              if (bodyEnd < 0) throw new Error("Unclosed Article JSON-LD: " + article.slug);
              const schema = JSON.parse(html.slice(bodyStart, bodyEnd));
              const expectedUrl = "https://jazielstory.site/articles/" + article.slug + ".html";
              if (schema["@type"] !== "Article" || schema.mainEntityOfPage?.["@id"] !== expectedUrl) {
                throw new Error("Invalid Article JSON-LD identity: " + article.slug);
              }
              if (!html.includes("../assets/js/main.js")) throw new Error("Incorrect main.js path: " + article.slug);
            }
            console.log("Verified Article JSON-LD and relative main.js paths for " + articles.length + " pages.");
          '
      - name: Verify sitemap and robots.txt
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync("articles.json", "utf8"));
            const articles = Array.isArray(data.articles) ? data.articles : [];
            const xml = fs.readFileSync("sitemap.xml", "utf8");
            const robots = fs.readFileSync("robots.txt", "utf8");
            const urls = xml.split("<loc>").slice(1).map(part => part.split("</loc>")[0]);
            const expected = ["https://jazielstory.site/", ...articles.map(a => "https://jazielstory.site/articles/" + a.slug + ".html")];
            const missing = expected.filter(url => !urls.includes(url));
            if (!xml.startsWith("<?xml") || !xml.includes("<urlset") || !xml.includes("</urlset>")) throw new Error("Invalid sitemap XML structure.");
            if (missing.length) throw new Error("Missing sitemap URLs: " + missing.join(", "));
            if (!robots.includes("User-agent: *") || !robots.includes("Sitemap: https://jazielstory.site/sitemap.xml")) throw new Error("robots.txt is missing crawler or sitemap directives.");
            console.log("Verified sitemap.xml (" + urls.length + " URLs) and robots.txt.");
          '
      - name: Commit generated pages
        run: |
          # git diff ignores untracked files; mark new pages intent-to-add first.
          git add -N -f articles/ sitemap.xml robots.txt
          if git diff --quiet -- articles/ sitemap.xml robots.txt; then
            echo "Static article pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f articles/ sitemap.xml robots.txt
          git commit -m "Build static article pages with OG metadata"
          git push
